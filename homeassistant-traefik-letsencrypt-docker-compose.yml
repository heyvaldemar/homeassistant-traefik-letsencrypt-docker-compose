# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  homeassistant: &homeassistant-image ${HOMEASSISTANT_IMAGE_TAG:-homeassistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe}

networks:
  homeassistant-network:
    external: true
  traefik-network:
    external: true

volumes:
  homeassistant-data:
  traefik-certificates:
  homeassistant-backups:

services:
  homeassistant:
    image: *homeassistant-image
    # Resource limits as .env-overridable defaults (e.g. HOMEASSISTANT_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${HOMEASSISTANT_MEMORY_LIMIT:-1g}
          cpus: "${HOMEASSISTANT_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${HOMEASSISTANT_MEMORY_RESERVATION:-128m}
          cpus: "${HOMEASSISTANT_CPU_RESERVATION:-0.25}"
    volumes:
      # Named volume so the HA database, users, automations, and
      # integrations survive container recreation — earlier revisions kept
      # /config inside the container and lost everything on every update.
      - homeassistant-data:/config
      - ./configuration.yaml:/config/configuration.yaml
    environment:
      TZ: ${HOMEASSISTANT_TIMEZONE:-America/New_York}
    networks:
      - homeassistant-network
      - traefik-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.homeassistant.rule=Host(`${HOMEASSISTANT_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.homeassistant.service=homeassistant"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      # Enable TLS on this router
      - "traefik.http.routers.homeassistant.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.homeassistant.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.homeassistant.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.homeassistant.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    # Resource limits as .env-overridable defaults (e.g. HOMEASSISTANT_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${HOMEASSISTANT_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${HOMEASSISTANT_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${HOMEASSISTANT_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${HOMEASSISTANT_BACKUPS_CPU_RESERVATION:-0.1}"
    # Every cycle: a consistent online copy of each SQLite database through
    # Python's backup API (no application stop), then a tar.gz of the rest of
    # the data directory (live database files excluded - the copies above are
    # the consistent ones). Logs OK/FAILED per artefact; a failed archive is
    # kept as .failed for diagnosis; retention 0 disables pruning.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep "$$HOMEASSISTANT_BACKUP_INIT_SLEEP"
        while true; do
          STAMP="$$(date +%Y-%m-%d_%H-%M)"
          for db in home-assistant_v2.db; do
            DB_FILE="$$HOMEASSISTANT_BACKUPS_PATH/$$HOMEASSISTANT_BACKUP_NAME-$${db%%.*}-$$STAMP.sqlite3"
            echo "[$$(date -Iseconds)] Starting database backup of $$db to $$DB_FILE.gz"
            if [ -f "/data/$$db" ] && python3 -c "import sqlite3,sys; s=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close(); s.close()" "/data/$$db" "$$DB_FILE" && gzip -f "$$DB_FILE"; then
              echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE.gz ($$(stat -c %s "$$DB_FILE.gz") bytes)"
            else
              echo "[$$(date -Iseconds)] Database backup FAILED - $$db could not be copied consistently" >&2
              rm -f "$$DB_FILE" "$$DB_FILE.gz"
            fi
          done
          DATA_FILE="$$HOMEASSISTANT_BACKUPS_PATH/$$HOMEASSISTANT_DATA_BACKUP_NAME-$$STAMP.tar.gz"
          echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE"
          tar -C /data --exclude='./home-assistant_v2.db' --exclude='./home-assistant_v2.db-wal' --exclude='./home-assistant_v2.db-shm' --exclude='./home-assistant.log*' --exclude='./.cache' -zcpf "$$DATA_FILE" .; RC=$$?
          if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
            echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)"
          else
            echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2
            mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true
          fi
          if [ "$${HOMEASSISTANT_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
            find "$$HOMEASSISTANT_BACKUPS_PATH" -type f \( -name "$$HOMEASSISTANT_BACKUP_NAME-*" -o -name "$$HOMEASSISTANT_DATA_BACKUP_NAME-*" \) -mtime "+$$HOMEASSISTANT_BACKUP_PRUNE_DAYS" -delete
          fi
          sleep "$$HOMEASSISTANT_BACKUP_INTERVAL"
        done
    volumes:
      - homeassistant-data:/data
      - homeassistant-backups:${HOMEASSISTANT_BACKUPS_PATH:-/srv/homeassistant/backups}
    environment:
      HOMEASSISTANT_BACKUP_INIT_SLEEP: ${HOMEASSISTANT_BACKUP_INIT_SLEEP:-30m}
      HOMEASSISTANT_BACKUP_INTERVAL: ${HOMEASSISTANT_BACKUP_INTERVAL:-24h}
      HOMEASSISTANT_BACKUP_PRUNE_DAYS: ${HOMEASSISTANT_BACKUP_PRUNE_DAYS:-7}
      HOMEASSISTANT_BACKUPS_PATH: ${HOMEASSISTANT_BACKUPS_PATH:-/srv/homeassistant/backups}
      HOMEASSISTANT_BACKUP_NAME: ${HOMEASSISTANT_BACKUP_NAME:-homeassistant-database-backup}
      HOMEASSISTANT_DATA_BACKUP_NAME: ${HOMEASSISTANT_DATA_BACKUP_NAME:-homeassistant-data-backup}
    restart: unless-stopped
